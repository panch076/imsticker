name: verify

# Checks on real Macs what cannot be checked anywhere else: that the Swift
# encoder builds, that what it writes decodes back to the source picture, and
# what Apple's sticker system on each macOS version looks like.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # macos-14 is no longer offered: a job asking for it is cancelled at once.
        os: [macos-15, macos-26, macos-15-intel]
    steps:
      - uses: actions/checkout@v5

      - name: System
        run: |
          sw_vers
          uname -m
          swift --version
          /usr/bin/python3 --version
          sqlite3 --version

      - name: Unit tests on Apple's own Python
        if: ${{ !cancelled() }}
        run: /usr/bin/python3 -m unittest discover -s tests

      - name: Swift helper type-checks
        if: ${{ !cancelled() }}
        run: |
          /usr/bin/python3 -c "import imsticker, sys; sys.stdout.write(imsticker.SWIFT_HELPER)" > "$RUNNER_TEMP/helper.swift"
          swiftc -typecheck "$RUNNER_TEMP/helper.swift"

      - name: Real helper, both routes, decoded and compared
        if: ${{ !cancelled() }}
        run: bash ci/verify_encoder.sh

      - name: StickerHack's handling of APNG timing (comparison only)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: bash ci/compare_stickerhack.sh

      - name: Experiments on the real sticker store
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: bash ci/experiments.sh

      - name: What the sticker frameworks contain
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: bash ci/probe_frameworks.sh
